name: Déploiement Azure
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Infrastructure Azure pas encore créée
        if: env.SWA_TOKEN == ''
        run: echo "::notice::Secret AZURE_STATIC_WEB_APPS_API_TOKEN absent — lance infra/deploy.sh puis ajoute le secret (voir README). Déploiement ignoré."
      - uses: actions/checkout@v4
        if: env.SWA_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.SWA_TOKEN != ''
        with: { node-version: 22, cache: npm }
      - if: env.SWA_TOKEN != ''
        run: npm ci && npm test && npm run build
      - uses: Azure/static-web-apps-deploy@v1
        if: env.SWA_TOKEN != ''
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: web/dist
          api_location: api/dist
          skip_app_build: true
          skip_api_build: true
