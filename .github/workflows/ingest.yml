name: Veille des offres
on:
  schedule:
    # 7h, 12h et 18h (heure de Paris, été) du lundi au samedi
    - cron: "0 5,10,16 * * 1-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Afficher les offres sans les enregistrer"
        type: boolean
        default: false
concurrency: ingest
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.KNOWLEDGE_REPO || 'Antoine2F/jobhunt-knowledge' }}
          token: ${{ secrets.KNOWLEDGE_TOKEN }}
          path: knowledge
          sparse-checkout: profil
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ingest
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          KNOWLEDGE_DIR: ${{ github.workspace }}/knowledge
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
